name: Security Checks

on:
  push:
    paths:
      - 'photos/**'
      - '_config.yml'
      - '_layouts/**'
      - '_includes/**'
  pull_request:
    paths:
      - 'photos/**'
      - '_config.yml'
      - '_layouts/**'
      - '_includes/**'

jobs:
  check-image-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Check for sensitive image metadata
        run: |
          echo "Checking for GPS, serial numbers, and sensitive metadata in images..."
          SENSITIVE_FOUND=0

          # Find all image files
          find photos -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.heic" -o -iname "*.webp" \) -print0 | while IFS= read -r -d '' file; do
            # Check for sensitive EXIF fields
            OUTPUT=$(exiftool -GPSLatitude -GPSLongitude -GPSPosition -SerialNumber -InternalSerialNumber -OwnerName -RawFileName "$file" 2>/dev/null)

            if [ -n "$OUTPUT" ]; then
              echo "::error file=$file::Sensitive metadata found in $file"
              echo "$OUTPUT"
              SENSITIVE_FOUND=1
            fi
          done

          if [ $SENSITIVE_FOUND -eq 1 ]; then
            echo "::error::Images contain sensitive metadata. Please strip metadata before committing."
            exit 1
          fi

          echo "No sensitive metadata found in images."

  check-source-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check _config.yml for dangerous includes
        run: |
          if grep -q 'include:' _config.yml && grep -q '"_\*"' _config.yml; then
            echo "::error file=_config.yml::Dangerous include pattern found: include: [\"_*\"] exposes source files"
            exit 1
          fi
          echo "_config.yml is safe"

      - name: Verify excluded files
        run: |
          # These files should be excluded from the build
          SHOULD_EXCLUDE=("README.md" "Gemfile" "Gemfile.lock")

          for file in "${SHOULD_EXCLUDE[@]}"; do
            if [ -f "$file" ]; then
              if ! grep -q "exclude:" _config.yml || ! grep -q "$file" _config.yml; then
                echo "::warning file=_config.yml::$file exists but may not be excluded from build"
              fi
            fi
          done

          echo "Source exposure check complete"
