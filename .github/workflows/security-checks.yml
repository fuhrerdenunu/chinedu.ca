name: Security Checks

on:
  push:
    paths:
      - 'photos/**'
      - '_config.yml'
      - '_layouts/**'
      - '_includes/**'
      - '_headers'
      - 'scripts/**'
      - 'tests/**'
      - 'Gemfile'
  pull_request:
    paths:
      - 'photos/**'
      - '_config.yml'
      - '_layouts/**'
      - '_includes/**'
      - '_headers'
      - 'scripts/**'
      - 'tests/**'
      - 'Gemfile'

jobs:
  check-image-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Check for sensitive image metadata
        run: scripts/check-image-metadata.sh photos

  security-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run security regression tests
        run: |
          python3 -m unittest tests/test_external_integrity.py -v
          bash tests/test_image_metadata.sh
          bash tests/test_site_exclusions.sh

  check-external-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Verify generated external-resource integrity
        run: python3 scripts/check-external-integrity.py _site

  check-source-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check _config.yml for dangerous includes
        run: |
          if grep -q 'include:' _config.yml && grep -q '"_\*"' _config.yml; then
            echo "::error file=_config.yml::Dangerous include pattern found: include: [\"_*\"] exposes source files"
            exit 1
          fi
          echo "_config.yml is safe"

      - name: Verify excluded files
        run: |
          # These files should be excluded from the build
          SHOULD_EXCLUDE=("README.md" "Gemfile" "Gemfile.lock")

          for file in "${SHOULD_EXCLUDE[@]}"; do
            if [ -f "$file" ]; then
              if ! grep -q "exclude:" _config.yml || ! grep -q "$file" _config.yml; then
                echo "::warning file=_config.yml::$file exists but may not be excluded from build"
              fi
            fi
          done

          echo "Source exposure check complete"
