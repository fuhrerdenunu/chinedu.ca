title: Chinedu
description: Travel and family moments - a personal photography portfolio showcasing journeys around the world
url: "https://chinedu.ca"
baseurl: ""

author:
  name: Chinedu
  url: https://chinedu.ca

# Social links for SEO
social:
  name: Chinedu
  links:
    - https://chinedu.ca

# Default image for social sharing
defaults:
  - scope:
      path: ""
    values:
      image: /assets/favicon.svg

markdown: kramdown
permalink: /blog/:title/

# Exclude source files from published site
exclude:
  - .github
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs
  - scripts
  - tests
  - vendor
  - node_modules
  - "*.gemspec"
  - LICENSE

plugins:
  - jekyll-feed
  - jekyll-seo-tag
